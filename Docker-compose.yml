services:
  db:
    image: postgres:15-alpine
    container_name: container_agendamento
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
      POSTGRES_DB: ${POSTGRES_DB:-db_name}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: container_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  postgres_test:
    image: postgres:16
    container_name: postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  postgres_data:
  redis_data:
